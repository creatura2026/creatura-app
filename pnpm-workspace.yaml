packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  vue-demi: true
  # Télécharge le binaire Electron (application de bureau, apps/desktop)
  electron: true
  # Installeur Squirrel, inutile ici (electron-builder produit un installeur NSIS)
  electron-winstaller: false

peerDependencyRules:
  allowedVersions:
    openapi-typescript>typescript: "6"