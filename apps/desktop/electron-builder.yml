# Paquets Windows de Créatura : `pnpm --filter desktop dist` (ou `dist:demo`, sans serveur).
appId: fr.esigelec.creatura
productName: Creatura
directories:
  output: release
files:
  - main.cjs
  - package.json
  - app-config.json
  - web/**/*
win:
  icon: ../player/public/pwa-512x512.png
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  shortcutName: Créatura
  uninstallDisplayName: Créatura
  # La désinstallation efface aussi %APPDATA%\Creatura (session, données locales) : une
  # réinstallation repart d'une app déconnectée.
  deleteAppDataOnUninstall: true
  # Version dans le nom ; le site trouve le fichier courant dans latest.json (scripts/build.cjs)
  artifactName: Creatura-Setup-${version}.${ext}
portable:
  artifactName: Creatura-${version}-portable.${ext}
