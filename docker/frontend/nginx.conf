# CREATURA - nginx pour une application front (SPA Vue, vue-router en mode history)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Sonde Kubernetes (readinessProbe / livenessProbe)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Fichiers générés par Vite, avec une empreinte dans le nom : cache d'un an
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Page d'entrée et fichiers de la PWA : toujours revalidés, pour voir chaque nouvelle version
    location ~ ^/(index\.html|sw\.js|registerSW\.js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Routes de l'application : renvoyées vers index.html (routage côté client)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
