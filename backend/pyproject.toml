[project]
name = "creatura-backend"
version = "0.1.0"
description = "API REST de CREATURA : collection et échange de cartes de créatures"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "psycopg[binary]>=3.2",
    "bcrypt>=5.0.0",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
