# =============================================================================
# CREATURA - Intégration continue du repo app
#
#   1. Vérifier  : tests de la base (SQL), du back (pytest sur PostgreSQL),
#                  du front (lint, types, tests unitaires, build),
#                  de bout en bout (Playwright sur l'API simulée, et hors PR
#                  sur la stack réelle en Docker)
#   2. Construire: une image Docker par composant
#   3. Publier   : les images sur GHCR, seulement si tout est vert et hors PR
#   4. Windows   : l'exe de l'application (apps/desktop) en artefact, hors PR ;
#                  Release GitHub sur un tag v*
#   5. Android   : l'APK de l'application (apps/mobile), de la même façon,
#                  après ses tests sur émulateur
#
# La release validée est déployée par le workflow deploy-aws.yml du dépôt infra.
# Aucun accès AWS dans ce dépôt ; voir docs/ci-cd.md.
# =============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Une PR mise à jour annule l'exécution précédente ; jamais sur main/develop.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  # Les PR construisent les images (le Dockerfile est vérifié) sans les publier.
  PUBLISH: ${{ github.event_name != 'pull_request' }}
  # Architecture des nœuds EKS (ajouter linux/arm64 pour des nœuds Graviton).
  PLATFORMS: linux/amd64

jobs:
  # ---------------------------------------------------------------------------
  # Composants présents dans ce commit (le front arrive avec la branche as-35)
  # ---------------------------------------------------------------------------
  detect:
    name: Composants
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      images: ${{ steps.detect.outputs.images }}
    steps:
      - uses: actions/checkout@v4

      - id: detect
        run: |
          images='[
            {"name": "creatura-backend", "context": "backend", "file": "backend/Dockerfile"},
            {"name": "creatura-db",      "context": "db",      "file": "db/Dockerfile"}
          ]'
          frontend=false
          if [ -f pnpm-workspace.yaml ]; then frontend=true; fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "images=$(jq -c . <<< "$images")" >> "$GITHUB_OUTPUT"
          echo "Front présent : $frontend" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Base de données : scripts SQL de db/ et image du Job de schéma
  # ---------------------------------------------------------------------------
  db:
    name: Base de données
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image de la base
        run: docker build -t creatura-db:ci db

      - name: Démarrer la base (schéma, catalogue et démo)
        run: |
          docker run -d --name creatura-db \
            -e POSTGRES_USER=creatura -e POSTGRES_PASSWORD=creatura -e POSTGRES_DB=creatura \
            -e CREATURA_DEMO=true \
            creatura-db:ci
          for _ in $(seq 1 60); do
            health=$(docker inspect -f '{{.State.Health.Status}}' creatura-db)
            [ "$health" = healthy ] && break
            sleep 2
          done
          docker logs creatura-db
          [ "$health" = healthy ]

      - name: Tests du schéma et des données
        run: |
          for test in test_schema test_donnees; do
            docker exec creatura-db psql -U creatura -d creatura -v ON_ERROR_STOP=1 -f "/db/tests/$test.sql"
          done

      - name: appliquer.sh est ré-exécutable (Job de schéma sur RDS)
        run: |
          docker exec -e PGUSER=creatura -e PGDATABASE=creatura -e CREATURA_DEMO=true \
            creatura-db /db/scripts/appliquer.sh
          docker exec creatura-db psql -U creatura -d creatura -v ON_ERROR_STOP=1 -f /db/tests/test_donnees.sql

  # ---------------------------------------------------------------------------
  # Back : tests sur un vrai PostgreSQL 16 (même version que RDS)
  # ---------------------------------------------------------------------------
  backend:
    name: Back
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: creatura
          POSTGRES_PASSWORD: creatura
          POSTGRES_DB: creatura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U creatura"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Les tests créent cette base et y appliquent db/init/ avant chaque test.
      TEST_DATABASE_URL: postgres://creatura:creatura@localhost:5432/creatura_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Installer les dépendances
        run: uv sync --frozen

      - name: Tests
        run: uv run pytest --junitxml=../reports/backend-tests.xml

      - name: Publier le rapport de tests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-backend-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/backend-tests.xml

  # ---------------------------------------------------------------------------
  # Front : PWA joueur et dashboard admin (monorepo pnpm)
  # ---------------------------------------------------------------------------
  frontend:
    name: Front
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # Les scripts lint corrigent ce qui peut l'être (--fix) : une correction non commitée
      # apparaît dans git diff et fait échouer l'étape, comme une erreur non corrigeable.
      - name: Lint
        run: |
          pnpm -r run lint
          git diff --exit-code

      - name: Vérification des types et build déployable
        env:
          VITE_API_BASE_URL: /api/v1
          VITE_API_MOCK: 'false'
        run: |
          pnpm --filter player run type-check
          pnpm --filter admin run type-check
          pnpm --filter player exec vite build
          pnpm --filter admin exec vite build --base=/admin/
          mkdir -p release-site/admin
          cp -a apps/player/dist/. release-site/
          cp -a apps/admin/dist/. release-site/admin/
          test -f release-site/index.html
          test -f release-site/admin/index.html

      - name: Tests unitaires
        run: pnpm -r run test:unit --run

      - name: Emballer et identifier le frontend testé
        run: python scripts/ci/package-frontend.py

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-meta-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend-meta.json
          if-no-files-found: error

      - name: Publier les applications construites
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-frontend/frontend.tar.gz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Tests de bout en bout (e2e/) : site joueur et dashboard admin sur l'API
  # simulée. PR : Chromium. Push : Chromium, Firefox, WebKit et mobile.
  # Stratégie et scénarios : docs/tests/README.md
  # ---------------------------------------------------------------------------
  e2e-mock:
    name: E2E (API simulée)
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # PR : retour rapide. Push : tous les navigateurs.
      E2E_BROWSERS: ${{ github.event_name == 'pull_request' && 'chromium' || 'chromium firefox webkit' }}
      E2E_SCRIPT: ${{ github.event_name == 'pull_request' && 'test:mock' || 'test:mock:all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Vérification des types des tests
        run: pnpm --filter e2e run type-check

      - name: Version de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-${{ env.E2E_BROWSERS }}

      - name: Installer les navigateurs
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps $E2E_BROWSERS

      - name: Dépendances système des navigateurs
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter e2e exec playwright install-deps $E2E_BROWSERS

      # Les apps sont construites en mode simulé puis servies par vite preview (playwright.config.ts).
      - name: Tests
        run: pnpm --filter e2e run $E2E_SCRIPT

      - name: Publier le rapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mock-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report/
            e2e/reports/
            e2e/test-results/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Tests de bout en bout sur la stack réelle : base et API en Docker
  # (e2e/compose.yaml), site et dashboard construits sans API simulée, vrai
  # WebSocket entre deux navigateurs. Hors PR : construit les images à chaque fois.
  # ---------------------------------------------------------------------------
  e2e-stack:
    name: E2E (stack réelle)
    needs: detect
    if: needs.detect.outputs.frontend == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # La stack reste en place après les tests : ses journaux sont publiés en cas d'échec.
      E2E_KEEP_STACK: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Version de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter e2e exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Installer Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter e2e exec playwright install --with-deps chromium

      - name: Dépendances système de Chromium
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter e2e exec playwright install-deps chromium

      # L'application Windows (Electron) est testée ici aussi, sous Linux : il lui faut un écran.
      - name: Écran virtuel pour Electron
        run: sudo apt-get install -y --no-install-recommends xvfb

      # Démarre la stack (stack/global-setup.ts), construit les apps, lance les tests.
      - name: Tests
        run: xvfb-run -a pnpm --filter e2e run test:stack

      - name: Journaux de la stack
        if: failure()
        run: |
          mkdir -p e2e/reports
          docker compose -f e2e/compose.yaml logs --no-color > e2e/reports/stack.log 2>&1 || true

      - name: Publier le rapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report-stack/
            e2e/reports/
            e2e/test-results-stack/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Application Windows (apps/desktop) : exe en artefact, et Release GitHub sur
  # un tag v*. Adresse du backend : variable CUSTOM_DOMAIN de l'environnement
  # production (domaine du site, devant CloudFront) ; sans elle, exe de
  # démonstration sur l'API simulée.
  # ---------------------------------------------------------------------------
  desktop:
    name: Application Windows
    needs: frontend
    # Pas sur les PR : plusieurs minutes de runner Windows à chaque mise à jour.
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    # Donne accès aux variables de l'environnement production (CUSTOM_DOMAIN).
    environment: production
    # Facultatif : un échec de l'exe est signalé sur ce job mais ne fait pas échouer la CI
    # (tests, front et images restent seuls juges). Aucun autre job n'en dépend.
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write # Release GitHub sur un tag v*
    defaults:
      run:
        shell: bash
    env:
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      # L'installeur Windows ne se construit que sous Windows : on s'arrête avant tout le reste.
      - name: Vérifier le système du runner
        if: runner.os != 'Windows'
        run: |
          echo "::error::L'exe se construit sur un runner Windows (runs-on: windows-latest), pas sur $RUNNER_OS."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Un tag v1.2.3 publie la version 1.2.3 : elle doit être celle de apps/desktop/package.json.
          if [[ "$GITHUB_REF" == refs/tags/v* ]] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $version de apps/desktop/package.json."
            exit 1
          fi

      - name: Construire l'exe
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            # « creatura.fr » ou « https://creatura.fr/ » : l'exe veut une adresse https:// sans / final.
            domain="${CUSTOM_DOMAIN%/}"
            case "$domain" in http://*|https://*) api_url="$domain" ;; *) api_url="https://$domain" ;; esac
            echo "API_URL=$api_url" >> "$GITHUB_ENV"
            pnpm desktop --api "$api_url"
          else
            echo "::warning::Variable CUSTOM_DOMAIN absente de l'environnement production : exe de démonstration (API simulée)."
            pnpm desktop:demo
          fi
          test -f apps/desktop/release/latest.json

      # L'exe construit démarre, sert le site qu'il embarque et lit l'adresse du backend dans
      # l'ordre prévu (e2e/specs-desktop/exe). En cas d'échec, l'exe n'est ni publié ni ajouté à
      # la Release (les étapes suivantes sont sautées).
      - name: Tests de l'exe
        run: pnpm --filter e2e run test:exe

      - name: Rapport des tests de l'exe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-exe-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/reports/
            e2e/test-results-exe/
          retention-days: 14
          if-no-files-found: ignore

      - name: Publier l'exe
        uses: actions/upload-artifact@v4
        with:
          name: creatura-windows-${{ steps.version.outputs.version }}
          path: |
            apps/desktop/release/Creatura-*.exe
            apps/desktop/release/latest.json
          if-no-files-found: error
          compression-level: 0 # les exe sont déjà compressés

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=(apps/desktop/release/Creatura-*.exe apps/desktop/release/latest.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Créatura $VERSION" --generate-notes
          fi

      - name: Résumé
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Application Windows $VERSION"
            if [ -n "$API_URL" ]; then echo "Backend : \`$API_URL\`"; else echo "Démonstration (API simulée)"; fi
            echo
            echo "Artefact : \`creatura-windows-$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Tests de l'application Android (e2e/specs-android) : deux APK de debug
  # (démo, et site injoignable) testés sur un émulateur Android 14 avec
  # Playwright Android. Le job mobile l'attend : un APK n'est publié que si ses
  # tests passent. Hors PR : construction Gradle et émulateur prennent du temps.
  # ---------------------------------------------------------------------------
  e2e-mobile:
    name: E2E (application Android)
    needs: detect
    if: needs.detect.outputs.frontend == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      # APK de debug (sans les secrets de signature) : leur WebView est inspectable.
      - name: Construire les APK de test
        run: pnpm --filter e2e run build:android

      # L'émulateur a besoin de l'accélération matérielle du runner.
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Tests sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: pnpm --filter e2e run test:android

      - name: Publier le rapport
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            e2e/playwright-report-android/
            e2e/reports/
            e2e/test-results-android/
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Application Android (apps/mobile) : APK en artefact, et ajouté à la Release
  # GitHub sur un tag v* de la même version. Adresse du site : variable
  # CUSTOM_DOMAIN de l'environnement production, comme pour l'exe ; sans elle,
  # APK de démonstration sur l'API simulée. Signature : secrets ANDROID_* ;
  # sans eux, APK signé avec une clé de debug.
  # ---------------------------------------------------------------------------
  mobile:
    name: Application Android
    # L'APK n'est construit et publié que si les tests de l'application ont réussi.
    needs: [frontend, e2e-mobile]
    # Pas sur les PR : plusieurs minutes de Gradle à chaque mise à jour.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Donne accès aux variables et secrets de l'environnement production.
    environment: production
    # Facultatif, comme l'exe : un échec est signalé sur ce job sans faire échouer la CI.
    continue-on-error: true
    timeout-minutes: 30
    permissions:
      contents: write # Release GitHub sur un tag v*
    env:
      CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Capacitor 8 demande Java 21 ; le SDK Android est déjà installé sur le runner.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Version
        id: version
        run: |
          version=$(node -p "require('./apps/mobile/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Un tag v1.2.3 ne reçoit l'APK que si apps/mobile/package.json est aussi en 1.2.3.
          publish=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "${GITHUB_REF_NAME#v}" = "$version" ]; then
              publish=true
            else
              echo "::notice::Tag $GITHUB_REF_NAME, APK en version $version : il n'est pas ajouté à la Release."
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 absent : APK signé avec une clé de debug. Chaque run a sa propre clé : pour mettre à jour l'application, il faudra la désinstaller d'abord."
            exit 0
          fi
          keystore="$RUNNER_TEMP/creatura.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "ANDROID_KEYSTORE_FILE=$keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Construire l'APK
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            # « creatura.fr » ou « https://creatura.fr/ » : l'APK veut une adresse https:// sans / final.
            domain="${CUSTOM_DOMAIN%/}"
            case "$domain" in http://*|https://*) site_url="$domain" ;; *) site_url="https://$domain" ;; esac
            echo "SITE_URL=$site_url" >> "$GITHUB_ENV"
            pnpm mobile --url "$site_url"
          else
            echo "::warning::Variable CUSTOM_DOMAIN absente de l'environnement production : APK de démonstration (API simulée)."
            pnpm mobile:demo
          fi
          test -f apps/mobile/release/android.json

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: creatura-android-${{ steps.version.outputs.version }}
          path: |
            apps/mobile/release/Creatura-*.apk
            apps/mobile/release/android.json
          if-no-files-found: error
          compression-level: 0 # un APK est déjà compressé

      - name: Release GitHub
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=(apps/mobile/release/Creatura-*.apk apps/mobile/release/android.json)
          # Le job Windows peut créer la même Release au même moment : on réessaie l'envoi.
          for attempt in 1 2 3; do
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber && exit 0
            else
              gh release create "$GITHUB_REF_NAME" "${files[@]}" --title "Créatura $VERSION" --generate-notes && exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Résumé
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          {
            echo "### Application Android $VERSION"
            if [ -n "$SITE_URL" ]; then echo "Site : \`$SITE_URL\`"; else echo "Démonstration (API simulée)"; fi
            if [ -n "$ANDROID_KEYSTORE_FILE" ]; then echo "Signé avec la clé de publication"; else echo "Signé avec une clé de debug"; fi
            echo
            echo "Artefact : \`creatura-android-$VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Images Docker : construites à chaque fois, publiées si tout est vert
  # ---------------------------------------------------------------------------
  images:
    name: Image ${{ matrix.image.name }}
    needs: [detect, db, backend, frontend, e2e-mock, e2e-stack]
    # Le front peut être absent (job ignoré), l'E2E sur stack réelle ne tourne pas sur les PR ;
    # tout le reste doit avoir réussi.
    if: >-
      ${{ !cancelled()
      && needs.db.result == 'success'
      && needs.backend.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.frontend.result)
      && contains(fromJSON('["success", "skipped"]'), needs['e2e-mock'].result)
      && contains(fromJSON('["success", "skipped"]'), needs['e2e-stack'].result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.detect.outputs.images) }}
    steps:
      - uses: actions/checkout@v4

      - name: Nom de l'image (GHCR exige des minuscules)
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.image.name }}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # sha-xxxxxxx : repère lisible ; la release référence le digest immuable.
          # develop / main : suit la branche. 1.2.3 et 1.2 : versions (tags git v1.2.3).
          tags: |
            type=sha,prefix=sha-
            type=raw,value=run-${{ github.run_id }}-${{ github.run_attempt }}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=${{ matrix.image.name }}
            org.opencontainers.image.vendor=CREATURA

      - name: Construire${{ env.PUBLISH == 'true' && ' et publier' || '' }}
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          build-args: ${{ matrix.image.app && format('APP={0}', matrix.image.app) || '' }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

      - name: Résumé
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### ${{ matrix.image.name }}"
            if [ "$PUBLISH" = true ]; then
              echo "Publiée : \`${IMAGE}@${DIGEST}\`"
            else
              echo "Construite, non publiée (pull request)."
            fi
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enregistrer le digest construit
        if: env.PUBLISH == 'true'
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-images
          jq -n --arg name "$IMAGE_NAME" --arg image "$IMAGE@$IMAGE_DIGEST" \
            '{name: $name, image: $image}' > "release-images/$IMAGE_NAME.json"

      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: release-${{ matrix.image.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-images/*.json
          if-no-files-found: error

  release:
    name: Release et déploiement develop
    needs: [db, backend, frontend, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-creatura-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-images
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: frontend-meta-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend-meta
      - name: Assembler la release du run validé
        env:
          APP_SHA: ${{ github.sha }}
          APP_RUN_ID: ${{ github.run_id }}
          APP_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          jq -s --arg sha "$APP_SHA" --arg run_id "$APP_RUN_ID" --arg attempt "$APP_RUN_ATTEMPT" \
            --slurpfile front frontend-meta/frontend-meta.json \
            '{schema_version: 2, commit: $sha, run_id: $run_id, run_attempt: $attempt,
              frontend_artifact: $front[0].frontend_artifact, frontend_sha256: $front[0].frontend_sha256,
              images: (map({key: .name, value: .image}) | from_entries)}' \
            release-images/*.json > release.json
          jq -e '.images["creatura-backend"] and .images["creatura-db"] and .frontend_sha256' release.json
      - uses: actions/upload-artifact@v4
        with:
          name: creatura-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: release.json
          if-no-files-found: error

  notify-infra:
    name: Déclencher le déploiement AWS
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - name: Attendre la conclusion CI puis demander le déploiement
        # Le run courant est encore in_progress. L'infra attend sa conclusion avant tout accès AWS.
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
          APP_RUN_ID: ${{ github.run_id }}
          APP_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          test -n "$GH_TOKEN"
          jq -n --arg run_id "$APP_RUN_ID" --arg attempt "$APP_RUN_ATTEMPT" \
            '{ref: "develop", inputs: {app_run_id: $run_id, app_run_attempt: $attempt}}' > /tmp/dispatch.json
          gh api --method POST repos/creatura2026/creatura-infra/actions/workflows/deploy-aws.yml/dispatches --input /tmp/dispatch.json
