# =============================================================================
# CREATURA - Contrôles de nuit (docs/tests/README.md, § 12)
#
#   1. Dépendances : failles connues (pnpm audit, pip-audit)
#   2. Images      : failles des images Docker de l'API et de la base (Trivy)
#   3. API         : contrat testé contre la vraie API (Schemathesis), charge (k6),
#                    scan de sécurité de l'API (OWASP ZAP), sur la stack des tests
#
# Trop longs pour chaque push, utiles chaque nuit : une faille publiée hier, une
# régression de performance. Lancement à la main : onglet Actions → Nuit → Run.
# Rien n'est publié ni déployé.
# =============================================================================
name: Nuit

on:
  schedule:
    - cron: "0 2 * * *" # 2 h UTC (3 h ou 4 h à Paris)
  workflow_dispatch:

permissions:
  contents: read

env:
  # Mêmes versions que lors de la mise en place (lot 6) ; à monter de temps en temps.
  TRIVY_IMAGE: aquasec/trivy:0.69.3
  SCHEMATHESIS_IMAGE: schemathesis/schemathesis:stable
  K6_IMAGE: grafana/k6:1.4.2
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable

jobs:
  # ---------------------------------------------------------------------------
  # Failles connues des dépendances. Failles examinées et acceptées : auditConfig
  # de pnpm-workspace.yaml (avec la raison).
  # ---------------------------------------------------------------------------
  dependances:
    name: Dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Front (pnpm audit, dépendances livrées)
        run: pnpm audit --prod --audit-level=high

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Back (pip-audit)
        working-directory: backend
        run: |
          uv export --frozen --no-dev --no-hashes --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --progress-spinner off

  # ---------------------------------------------------------------------------
  # Failles des images (paquets système et Python), corrigibles seulement
  # (--ignore-unfixed). Les Dockerfile appliquent les correctifs Debian au build.
  # gosu (image officielle postgres) est exclu : binaire de l'image de base, il ne
  # sert qu'au démarrage du conteneur et ne se corrige que par une nouvelle image
  # postgres:16.
  # ---------------------------------------------------------------------------
  images:
    name: Image ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: creatura-backend, context: backend, skip: "" }
          - { name: creatura-db, context: db, skip: "--skip-files usr/local/bin/gosu" }
    steps:
      - uses: actions/checkout@v4

      - name: Construire l'image
        run: docker build --pull -t ${{ matrix.image.name }}:nuit ${{ matrix.image.context }}

      - name: Scan (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 \
            ${{ matrix.image.skip }} ${{ matrix.image.name }}:nuit

  # ---------------------------------------------------------------------------
  # La vraie API, sur la stack des tests (e2e/compose.yaml) :
  #  - Schemathesis : requêtes générées depuis creatura-api.openapi.yaml ; aucune
  #    ne doit provoquer d'erreur serveur (500) ;
  #  - k6 : charge (e2e/load/charge.js) avec ses seuils ;
  #  - OWASP ZAP : scan de l'API à partir du contrat (rapport, sans échec bloquant).
  # ---------------------------------------------------------------------------
  api:
    name: API (contrat, charge, sécurité)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Démarrer la stack
        run: docker compose -f e2e/compose.yaml up -d --build --wait

      - name: Jeton administrateur
        run: |
          token=$(curl -sf -X POST http://localhost:58000/api/v1/auth/login \
            -H 'content-type: application/json' -d '{"login":"admin","password":"admin"}' | jq -r .accessToken)
          echo "::add-mask::$token"
          echo "API_TOKEN=$token" >> "$GITHUB_ENV"

      # Pas de DELETE : il supprimerait le compte du test (DELETE /me).
      - name: Contrat (Schemathesis)
        run: |
          mkdir -p reports
          docker run --rm --network host -v "$PWD:/repo" -w /repo "$SCHEMATHESIS_IMAGE" run \
            creatura-api.openapi.yaml --url http://localhost:58000/api/v1 \
            -H "Authorization: Bearer $API_TOKEN" --max-examples 50 \
            --checks not_a_server_error --exclude-method DELETE \
            --report junit --report-dir reports/schemathesis

      - name: Charge (k6)
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --network host -v "$PWD/e2e/load:/load:ro" -v "$PWD/reports:/reports" \
            -e BASE_URL=http://localhost:58000/api/v1 -e PLAYERS=40 -e DURATION=2m \
            "$K6_IMAGE" run --summary-export /reports/k6-resume.json /load/charge.js

      - name: Sécurité de l'API (OWASP ZAP)
        if: ${{ !cancelled() }}
        run: |
          mkdir -p reports/zap && cp creatura-api.openapi.yaml reports/zap/
          chmod -R a+rwx reports/zap
          docker run --rm --network host -v "$PWD/reports/zap:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-api-scan.py -t /zap/wrk/creatura-api.openapi.yaml -f openapi \
            -O http://localhost:58000/api/v1 -I -r zap-api.html -J zap-api.json

      - name: Journaux de la stack
        if: failure()
        run: docker compose -f e2e/compose.yaml logs --no-color > reports/stack.log 2>&1 || true

      - name: Publier les rapports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: nuit-api-${{ github.run_id }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

      - name: Arrêter la stack
        if: always()
        run: docker compose -f e2e/compose.yaml down -v
